<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color:#ffffff; font-family:'Inter', Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr-plots" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="hdr-weather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <linearGradient id="hdr-price" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <linearGradient id="hdr-master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="hdr-ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Main Title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="#1b5e20">Qiyas Crop Intelligence — Entity-Relationship (ER) Data Model</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#666666">Team 6 Submission • End-to-End Pipeline &amp; Temporal Feature Aggregations</text>

  <!-- Entity 1: PLOTS -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="340" height="260" rx="12" fill="#f1f8e9" stroke="#a5d6a7" stroke-width="1.5"/>
    <rect x="40" y="110" width="340" height="45" rx="12" fill="url(#hdr-plots)"/>
    <rect x="40" y="143" width="340" height="12" fill="url(#hdr-plots)"/>
    <text x="210" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">PLOTS (plots_train / plots_test)</text>
    
    <text x="60" y="178" font-size="13" font-weight="700" fill="#1b5e20">[PK] plot_id : String</text>
    <text x="60" y="200" font-size="12" fill="#333333">[FK] region : String (Oromia, Amhara, SNNPR...)</text>
    <text x="60" y="220" font-size="12" fill="#333333">crop_type : String (Teff, Wheat, Maize...)</text>
    <text x="60" y="240" font-size="12" fill="#333333">survey_year : Int (2021-2024)</text>
    <text x="60" y="260" font-size="12" fill="#333333">planting_month : Int / String (1-12)</text>
    <text x="60" y="280" font-size="12" fill="#333333">farm_size_ha, fertilizer_kg, labor_days</text>
    <text x="60" y="300" font-size="12" fill="#333333">improved_seed (0/1), pest_disease_flag (0/1)</text>
    <text x="60" y="320" font-size="12" fill="#333333">soil_quality_index (0.0-1.0), altitude_m</text>
    <text x="60" y="345" font-size="12" font-weight="700" fill="#2e7d32">[TARGET] yield_tons_per_ha : Float</text>
  </g>

  <!-- Entity 2: REGIONAL_WEATHER -->
  <g filter="url(#shadow)">
    <rect x="430" y="110" width="340" height="200" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
    <rect x="430" y="110" width="340" height="45" rx="12" fill="url(#hdr-weather)"/>
    <rect x="430" y="143" width="340" height="12" fill="url(#hdr-weather)"/>
    <text x="600" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">REGIONAL_WEATHER</text>
    
    <text x="450" y="178" font-size="13" font-weight="700" fill="#0d47a1">[PK] (region, year, month)</text>
    <text x="450" y="205" font-size="12" fill="#333333">temp_mean_c : Float</text>
    <text x="450" y="230" font-size="12" fill="#333333">rainfall_mm : Float</text>
    <text x="450" y="255" font-size="12" fill="#333333">extreme_heat_days : Int</text>
    <text x="450" y="285" font-size="11" font-style="italic" fill="#1565c0">* Joined over 4-month growing season window</text>
  </g>

  <!-- Entity 3: MARKET_PRICES -->
  <g filter="url(#shadow)">
    <rect x="820" y="110" width="340" height="200" rx="12" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
    <rect x="820" y="110" width="340" height="45" rx="12" fill="url(#hdr-price)"/>
    <rect x="820" y="143" width="340" height="12" fill="url(#hdr-price)"/>
    <text x="990" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MARKET_PRICES</text>
    
    <text x="840" y="178" font-size="13" font-weight="700" fill="#4a148c">[PK] (region, crop_type, year)</text>
    <text x="840" y="208" font-size="12" fill="#333333">price_birr_per_quintal : Float</text>
    <text x="840" y="235" font-size="12" fill="#333333">market_volume_tons : Float</text>
    <text x="840" y="265" font-size="11" font-style="italic" fill="#6a1b9a">* Outlier cleaned (&lt; 20,000 Birr/qtl)</text>
  </g>

  <!-- Entity 4: MASTER_ENGINEERED_FEATURES -->
  <g filter="url(#shadow)">
    <rect x="230" y="430" width="350" height="230" rx="12" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
    <rect x="230" y="430" width="350" height="45" rx="12" fill="url(#hdr-master)"/>
    <rect x="230" y="463" width="350" height="12" fill="url(#hdr-master)"/>
    <text x="405" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MASTER ENGINEERED FEATURES</text>
    
    <text x="250" y="498" font-size="13" font-weight="700" fill="#e65100">[PK] plot_id : String</text>
    <text x="250" y="520" font-size="12" fill="#333333">season_temp_mean (4-month growing window)</text>
    <text x="250" y="540" font-size="12" fill="#333333">season_rainfall_sum (Cumulative mm)</text>
    <text x="250" y="560" font-size="12" fill="#333333">fertilizer_per_ha_ratio (kg/ha)</text>
    <text x="250" y="580" font-size="12" fill="#333333">labor_per_ha_ratio (days/ha)</text>
    <text x="250" y="600" font-size="12" fill="#333333">is_late_planting (flag if month &gt; 6)</text>
    <text x="250" y="620" font-size="12" fill="#333333">expected_revenue_birr_ha (yield * price)</text>
  </g>

  <!-- Entity 5: ML MODEL PIPELINE & SUBMISSION -->
  <g filter="url(#shadow)">
    <rect x="650" y="430" width="360" height="230" rx="12" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
    <rect x="650" y="430" width="360" height="45" rx="12" fill="url(#hdr-ml)"/>
    <rect x="650" y="463" width="360" height="12" fill="url(#hdr-ml)"/>
    <text x="830" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ML PIPELINE &amp; SUBMISSION</text>
    
    <text x="670" y="498" font-size="13" font-weight="700" fill="#b71c1c">[BEST MODEL] HistGradientBoostingRegressor</text>
    <text x="670" y="520" font-size="12" fill="#333333">CV RMSE: 0.4960 | CV R²: 0.8740</text>
    <text x="670" y="540" font-size="12" fill="#333333">Pipeline: ColumnTransformer + Median Imputer</text>
    <line x1="670" y1="552" x2="990" y2="552" stroke="#ef9a9a" stroke-dasharray="3 3"/>
    <text x="670" y="575" font-size="13" font-weight="700" fill="#b71c1c">[OUTPUT] team_6_submission.csv</text>
    <text x="670" y="595" font-size="12" fill="#333333">plot_id : 3,751 unseen test plots</text>
    <text x="670" y="615" font-size="12" fill="#333333">predicted_yield_tons_per_ha : Float</text>
  </g>

  <!-- Relationship Connectors -->
  <path d="M 210 370 L 210 400 L 405 400 L 405 430" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 310 L 600 400 L 405 400 L 405 430" fill="none" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 990 310 L 990 400 L 405 400 L 405 430" fill="none" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 545 L 650 545" fill="none" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrow)"/>

</svg>
